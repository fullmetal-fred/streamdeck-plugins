<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <!-- Clipboard body -->
  <rect x="32" y="28" width="80" height="100" rx="8" ry="8"
        fill="none" stroke="#d8d8d8" stroke-width="6"/>
  <!-- Clipboard clip -->
  <rect x="52" y="20" width="40" height="16" rx="4" ry="4"
        fill="#d8d8d8"/>
  <!-- Keyboard icon at bottom -->
  <rect x="44" y="108" width="56" height="16" rx="3" ry="3"
        fill="none" stroke="#007aff" stroke-width="2"/>
  <rect x="50" y="112" width="6" height="4" rx="1" fill="#007aff"/>
  <rect x="60" y="112" width="6" height="4" rx="1" fill="#007aff"/>
  <rect x="70" y="112" width="6" height="4" rx="1" fill="#007aff"/>
  <rect x="80" y="112" width="6" height="4" rx="1" fill="#007aff"/>
  <!-- Arrow from clipboard to keyboard -->
  <line x1="72" y1="76" x2="72" y2="102" stroke="#007aff" stroke-width="3" stroke-linecap="round"/>
  <polyline points="64,96 72,104 80,96" fill="none" stroke="#007aff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text lines -->
  <line x1="48" y1="50" x2="96" y2="50" stroke="#d8d8d8" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="62" x2="88" y2="62" stroke="#d8d8d8" stroke-width="3" stroke-linecap="round"/>
</svg>
