<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <!-- Clipboard body -->
  <rect x="32" y="28" width="80" height="100" rx="8" ry="8"
        fill="none" stroke="#d8d8d8" stroke-width="6"/>
  <!-- Clipboard clip -->
  <rect x="52" y="20" width="40" height="16" rx="4" ry="4"
        fill="#d8d8d8"/>
  <!-- Text lines representing content -->
  <line x1="48" y1="60" x2="96" y2="60" stroke="#d8d8d8" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="76" x2="88" y2="76" stroke="#d8d8d8" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="92" x2="80" y2="92" stroke="#d8d8d8" stroke-width="4" stroke-linecap="round"/>
  <!-- Typing cursor -->
  <rect x="84" y="86" width="3" height="14" fill="#007aff"/>
</svg>
