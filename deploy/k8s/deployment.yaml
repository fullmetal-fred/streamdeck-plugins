apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliptype-pr-__PR_NUMBER__
  namespace: pr-previews
  labels:
    app: cliptype-preview
    pr: "__PR_NUMBER__"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cliptype-preview
      pr: "__PR_NUMBER__"
  template:
    metadata:
      labels:
        app: cliptype-preview
        pr: "__PR_NUMBER__"
    spec:
      containers:
        - name: preview
          image: __IMAGE__
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cliptype-pr-__PR_NUMBER__
  namespace: pr-previews
  labels:
    app: cliptype-preview
    pr: "__PR_NUMBER__"
spec:
  selector:
    app: cliptype-preview
    pr: "__PR_NUMBER__"
  ports:
    - port: 80
      targetPort: 8080
