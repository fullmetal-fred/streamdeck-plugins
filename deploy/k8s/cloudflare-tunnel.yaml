# This manifest adds an ingress rule to the existing cloudflared tunnel
# so that pr-<N>.dev.hyperscaleav.com routes to the PR's service.
#
# It assumes cloudflared is already running in the cluster as a Deployment
# with a ConfigMap named "cloudflared-config" in namespace "cloudflare-system".
#
# The GitHub Actions workflow patches this ConfigMap dynamically.
# See .github/workflows/pr-preview-deploy.yml for the implementation.
#
# If you prefer a standalone tunnel per PR, swap this for a full
# cloudflared Deployment + ConfigMap pair (commented alternative below).

