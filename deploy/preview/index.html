<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipType — PR Preview</title>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 600px; width: 90%; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); margin-bottom: 1.5rem; }
    .meta { display: grid; grid-template-columns: auto 1fr; gap: 0.4rem 1rem; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .meta dt { color: var(--muted); }
    .meta dd a { color: var(--accent); text-decoration: none; }
    .download { display: inline-block; background: var(--green); color: #fff; font-weight: 600; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-size: 1rem; transition: opacity 0.15s; }
    .download:hover { opacity: 0.85; }
    .note { color: var(--muted); font-size: 0.8rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>ClipType Stream Deck Plugin</h1>
      <p class="subtitle">PR #__PR_NUMBER__ preview build</p>
      <dl class="meta">
        <dt>Branch</dt>  <dd>__BRANCH__</dd>
        <dt>Commit</dt>  <dd><code>__SHA_SHORT__</code></dd>
        <dt>PR</dt>      <dd><a href="__PR_URL__">#__PR_NUMBER__</a></dd>
        <dt>Built</dt>   <dd>__BUILD_TIME__</dd>
      </dl>
      <a class="download" href="/plugin/com.fullmetalfred.cliptype.streamDeckPlugin">Download .streamDeckPlugin</a>
      <p class="note">Double-click the downloaded file to install in Stream Deck.</p>
    </div>
  </div>
</body>
</html>
